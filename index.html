<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katakana Trainer</title><style>body{margin:0;font-family:Arial;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;text-align:center}#kana{font-size:160px}#romaji{font-size:48px;color:#6ec6ff;height:60px}button{margin-top:40px;padding:15px 35px;font-size:24px}</style></head><body><div><div id="kana"></div><div id="romaji"></div><button onclick="nextKana(event)">Next</button><p>Tap anywhere to reveal the romaji.</p></div><script>
const kana=[["ア","a"],["イ","i"],["ウ","u"],["エ","e"],["オ","o"],["カ","ka"],["キ","ki"],["ク","ku"],["ケ","ke"],["コ","ko"],["サ","sa"],["シ","shi"],["ス","su"],["セ","se"],["ソ","so"],["タ","ta"],["チ","chi"],["ツ","tsu"],["テ","te"],["ト","to"],["ナ","na"],["ニ","ni"],["ヌ","nu"],["ネ","ne"],["ノ","no"],["ハ","ha"],["ヒ","hi"],["フ","fu"],["ヘ","he"],["ホ","ho"],["マ","ma"],["ミ","mi"],["ム","mu"],["メ","me"],["モ","mo"],["ヤ","ya"],["ユ","yu"],["ヨ","yo"],["ラ","ra"],["リ","ri"],["ル","ru"],["レ","re"],["ロ","ro"],["ワ","wa"],["ヲ","wo"],["ン","n"]];
let current,shown=false;function randomKana(){current=kana[Math.floor(Math.random()*kana.length)];kanaEl.textContent=current[0];romaji.textContent="";shown=false;}function nextKana(e){e.stopPropagation();randomKana();}const kanaEl=document.getElementById("kana"),romaji=document.getElementById("romaji");document.body.onclick=()=>{if(!shown){romaji.textContent=current[1];shown=true;}};randomKana();
</script></body></html>
